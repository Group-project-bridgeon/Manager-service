# ==============================================================================
# DEV-ONLY / STANDALONE ENVIRONMENT
# DO NOT RUN ALONGSIDE THE ERP PLATFORM
#
# This Docker Compose file is intended strictly for isolated local development
# of manager-service in standalone mode. Running this alongside the main ERP
# platform will cause port conflicts (e.g., port 5432 and 8080) and database
# collisions with the platform postgres instance.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
# ==============================================================================

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-manager-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - PORT=8080
      - LOG_LEVEL=debug
      - READ_TIMEOUT=5s
      - WRITE_TIMEOUT=10s
      - IDLE_TIMEOUT=120s
      - SHUTDOWN_TIMEOUT=5s
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password_change_in_production
      - DB_NAME=erp_manager
      - DB_SSLMODE=disable
      - DB_MAX_CONNS=25
      - DB_MIN_CONNS=5
      - JWT_PUBLIC_KEY_PATH=/keys/jwt_public.pem
      - JWT_ISSUER=erp-auth
      - JWT_AUDIENCE=erp-api
    volumes:
      - ./keys/jwt_public.pem:/keys/jwt_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-network

  postgres:
    image: postgres:16-alpine
    container_name: erp-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_manager"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

volumes:
  pgdata:

networks:
  erp-network:
    driver: bridge
